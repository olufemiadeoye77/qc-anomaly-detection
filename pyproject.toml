[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-detector"
version = "0.1.0"
description = "QC anomaly detection for PKO/PKC lab samples"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "openpyxl",
]

[tool.setuptools]
packages = ["qc_detector"]